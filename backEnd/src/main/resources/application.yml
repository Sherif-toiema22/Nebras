spring:
  jpa:
    open-in-view: false
    hibernate.ddl-auto: none      # المخطط تديره Flyway فقط
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nebras}
    username: ${DB_USER:nebras}
    password: ${DB_PASSWORD:nebras}
nebras:
  jwt:
    secret: ${JWT_SECRET}          # إجباري، ٣٢ حرفًا على الأقل
    hours: 12
  admin:
    email: ${ADMIN_EMAIL:admin@nebras.local}
    password: ${ADMIN_PASSWORD:}   # إن تُرك فارغًا لا يُنشأ مدير تلقائيًا
  cors-origin: ${CORS_ORIGIN:http://localhost:4200}
